services:
  personal-website:
    image: crpi-wwifswyqz8bp8ddb.cn-wulanchabu.personal.cr.aliyuncs.com/stellerainn/personal-website:frontend-latest
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile
    container_name: personal-website
    restart: always
    expose:
      - "80"
    networks:
      - portfolio-public

  portfolio-gateway:
    image: nginx:1.27-alpine
    container_name: portfolio-gateway
    restart: always
    depends_on:
      - personal-website
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/edge-nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/portfolio-routes.conf:/etc/nginx/snippets/portfolio-routes.conf:ro
      - ./deploy/certbot/conf:/etc/letsencrypt:ro
      - ./deploy/certbot/www:/var/www/certbot:ro
    networks:
      - portfolio-public

  certbot:
    image: certbot/certbot:v5.7.0
    profiles:
      - certbot
    volumes:
      - ./deploy/certbot/conf:/etc/letsencrypt
      - ./deploy/certbot/www:/var/www/certbot

networks:
  portfolio-public:
    external: true
