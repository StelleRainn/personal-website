map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# Domain traffic is upgraded to HTTPS. The ACME path remains available for renewal.
server {
    listen 80;
    server_name stellerainn.com www.stellerainn.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Keep the public IP as an HTTP-only fallback and diagnostic entry.
server {
    listen 80 default_server;
    server_name _;

    include /etc/nginx/snippets/portfolio-routes.conf;
}

server {
    listen 443 ssl;
    http2 on;
    server_name stellerainn.com www.stellerainn.com;

    ssl_certificate /etc/letsencrypt/live/stellerainn.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stellerainn.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    include /etc/nginx/snippets/portfolio-routes.conf;
}
