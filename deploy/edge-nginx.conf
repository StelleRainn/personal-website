map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80 default_server;
    server_name stellerainn.com www.stellerainn.com _;

    resolver 127.0.0.11 valid=30s ipv6=off;

    location = /acir {
        return 302 /acir/;
    }

    location = /rosa-bookshelf {
        return 302 /rosa-bookshelf/;
    }

    location /rosa-bookshelf/ {
        set $rosa_bookshelf_upstream http://rosa-bookshelf:80;
        rewrite ^/rosa-bookshelf/(.*)$ /$1 break;
        proxy_pass $rosa_bookshelf_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location = /shopping-mall {
        return 302 /shopping-mall/;
    }

    location /shopping-mall/ {
        set $shopping_mall_upstream http://shopping-mall:80;
        rewrite ^/shopping-mall/(.*)$ /$1 break;
        proxy_pass $shopping_mall_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location = /xiaotuxian-pc {
        return 302 /xiaotuxian-pc/;
    }

    location /xiaotuxian-pc/ {
        set $xiaotuxian_upstream http://xiaotuxian-pc:80;
        rewrite ^/xiaotuxian-pc/(.*)$ /$1 break;
        proxy_pass $xiaotuxian_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /bilibili-imitation {
        return 302 /bilibili-imitation/;
    }

    location /bilibili-imitation/ {
        set $bilibili_upstream http://bilibili-imitation:80;
        rewrite ^/bilibili-imitation/(.*)$ /$1 break;
        proxy_pass $bilibili_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 临时 IP-only 入口：在未购买域名时通过 /acir/ 访问毕业设计。
    # ACIR 前端需以 VITE_PUBLIC_BASE_URL=/acir/ 构建，静态资源会请求 /acir/assets/*。
    location /acir/assets/ {
        set $acir_upstream http://acir-frontend:80;
        rewrite ^/acir/(.*)$ /$1 break;
        proxy_pass $acir_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /acir/ {
        set $acir_upstream http://acir-frontend:80;
        rewrite ^/acir/(.*)$ /$1 break;
        proxy_pass $acir_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        add_header Cache-Control "no-cache";
    }

    # ACIR 当前 axios baseURL 为 /api；暂时由公网根路径转发给 ACIR 前端 Nginx。
    location /api/ {
        set $acir_upstream http://acir-frontend:80;
        proxy_pass $acir_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ACIR 有少量 public 资源使用 /backgrounds/* 绝对路径。
    location /backgrounds/ {
        set $acir_upstream http://acir-frontend:80;
        proxy_pass $acir_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        set $personal_upstream http://personal-website:80;
        proxy_pass $personal_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

server {
    listen 80;
    server_name rose.example.com acir.example.com;

    resolver 127.0.0.11 valid=30s ipv6=off;

    location / {
        set $acir_upstream http://acir-frontend:80;
        proxy_pass $acir_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
